{% extends 'base.html' %}
{% block titre %}Mot de passe réinitialisé{% endblock %}
{% block contenu %}
<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card text-center">
          <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-circle-check"></i></div>
            <h1 class="auth-title">C'est fait !</h1>
            <p class="auth-subtitle">Votre mot de passe a été réinitialisé avec succès.</p>
          </div>
          <div class="auth-footer">
            <a href="{% url 'accounts:connexion' %}" class="btn btn-primary w-100 btn-auth">
              <i class="fas fa-sign-in-alt me-2"></i>Se connecter
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
